<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>متتبع حفظ القرآن</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/students.css">
  <link rel="stylesheet" href="css/levels.css">
  <link rel="stylesheet" href="css/student-profile.css">

          </li>
          <li>

              <span class="nav-icon">&#x1F4DA;</span>
              <span class="nav-label">المستويات</span>

          </li>
          <li>
            <a href="#" class="nav-item" data-screen="surahs">
              <span class="nav-icon">&#x1F4D6;</span>
              <span class="nav-label">السور</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-item" data-screen="progress-matrix">
              <span class="nav-icon">&#x1F4CB;</span>

            </a>
          </li>
          <li>
            <a href="#" class="nav-item" data-screen="backup">
              <span class="nav-icon">&#x1F4BE;</span>
              <span class="nav-label">النسخ الاحتياطي</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-item" data-screen="settings">

              <span class="nav-label">الإعدادات</span>
